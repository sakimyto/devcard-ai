# name は変更不可: devcard-ai.sakimyto.workers.dev（旧バッジの埋め込み先）がこの名前から
# 派生する。変えると api/index.ts の LEGACY_HOSTS 301 が届かなくなり旧バッジが死ぬ
name = "devcard-ai"
main = "api/index.ts"
compatibility_date = "2025-01-01"
# account_id is set via CLOUDFLARE_ACCOUNT_ID env var

# 正準ドメインは pullcard.sakimyto.com。devcard.sakimyto.com と workers.dev は
# 旧バッジ埋め込み用に残し、worker 内で 301 集約する（消すと既存バッジが死ぬ）
workers_dev = true
routes = [
  { pattern = "pullcard.sakimyto.com", custom_domain = true },
  { pattern = "devcard.sakimyto.com", custom_domain = true }
]

# Cap CPU so adversarial inputs (e.g. huge SVG → PNG paths) can't burn budget.
[limits]
cpu_ms = 100

[observability]
enabled = true

# Per-IP rate limit on the expensive paths. これは「1つの IP が暴れないこと」しか保証しない。
# GitHub App の GraphQL クォータ（5,000 pt/h・キャッシュミス1回の実測 3pt）は全リクエストで
# 共有する資源なので、IP を替えれば素通りする per-IP 制限では守れない。上流の保護は
# api/index.ts の UPSTREAM_MISS_BUDGET_PER_HOUR（グローバルなキャッシュミス上限）が担う。
[[unsafe.bindings]]
name = "API_RATELIMIT"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# 上流保護のグローバル制限（IP ではなく固定キーで数える）。GitHub App の GraphQL 枠は
# 5,000 pt/h で、キャッシュミス1回の実測コストは 3pt（クエリ3本 × cost 1、2026-08-21 実測）。
# 天井は毎時 1,600 回程度なので、REST の installation 解決ぶんを残して毎分25回に均す。
# 超過分は stale か placeholder に落ちる。KV カウンタ（api/index.ts）は読み書きが
# アトミックでないため、締めるのはこちらが主。
[[unsafe.bindings]]
name = "UPSTREAM_RATELIMIT"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 25, period = 60 }

# Bundle subset fonts as binary (ArrayBuffer) for resvg's fontBuffers. Without
# this, resvg-wasm has no fonts and every OGP PNG renders with all text missing.
[[rules]]
type = "Data"
globs = ["**/*.ttf"]
fallthrough = true

# SWR card cache: fresh 6h / stale 24h (stale-if-error). GitHub API 枯渇時は
# stale を供給し、それも無ければ placeholder カードにフォールバックする。
[[kv_namespaces]]
binding = "DEVCARD_KV"
id = "ca24610c06d74e7e933bc45534c49451"

# distinct レンダリングユーザー計測（KPI: 30日 distinct index1）
[[analytics_engine_datasets]]
binding = "CARD_ANALYTICS"
dataset = "devcard_renders"
