name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: test + typecheck + lint + config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies (frozen)
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      # continue-on-error を外した。緑を素通りする lint は、無いのと同じで
      # 「CI は通っている」という誤った安心だけを生む
      - name: Lint
        run: bun run lint

      # wrangler.toml の破損（バインディング名の typo、unsafe セクションの書き間違い）は
      # テストでも型検査でも捕まらず、デプロイ時に初めて落ちる。ここで先に落とす
      - name: Validate worker config
        run: bunx wrangler deploy --dry-run

      # 本番に出荷される依存だけを対象にする。dev 依存（vitest→vite 連鎖）の勧告は
      # Worker には載らないので、ここで赤くしても直す先が無い
      - name: Audit production dependencies
        run: bun audit --prod
