name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # 2026-08-21: 以前はシークレット未設定なら deploy を **スキップして success** にしていた。
  # ブートストラップ中に赤くしないための配慮だったが、公開後は「Deploy ✅ なのに本番は
  # 古いまま」という最悪の偽グリーンになる（実際に 8/18 のコードが 8/21 まで残った）。
  # 未設定は設定漏れであって正常系ではないので、赤で落として気づけるようにする。
  check-secrets:
    runs-on: ubuntu-latest
    steps:
      - id: check
        # シークレットは env 経由で渡す。`${{ secrets.X }}` を run: の中に直接展開すると、
        # 値そのものがランナー上のシェルスクリプトへ書き込まれ、シェルのメタ文字を含む値なら
        # コマンドとして解釈されうる（存在チェックのために値を晒す必要はない）。
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID が未設定のためデプロイできません。リポジトリの Secrets に設定してください（未設定のまま success にすると、本番が古いままなのに緑に見えます）。"
            exit 1
          fi

  deploy:
    needs: check-secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies (frozen)
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
